name: validate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.402'
      - name: Validate source and release declarations
        shell: pwsh
        run: ./Tools~/Validate-Release.ps1
      - name: Detached disposable publisher acceptance
        shell: pwsh
        run: ./Tools~/Test-Publisher.ps1 -EvidenceDirectory "${{ runner.temp }}/gf-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publisher-acceptance
          path: ${{ runner.temp }}/gf-evidence
