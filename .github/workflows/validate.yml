name: validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate candidate metadata and current guides
        shell: pwsh
        run: ./Tools~/Validate-Release.ps1
      - name: Run isolated host and real Git regressions
        run: python -m unittest discover -s Tools~/Queue -p "TestGitFlow*.py" -v
