name: validate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source and release declarations
        shell: pwsh
        run: ./Tools~/Validate-Release.ps1
      - name: Validate commit-before-queue preservation
        working-directory: Tools~/Queue
        shell: pwsh
        run: python -m unittest -v TestGitFlowCommit.CommitBeforeQueueAcceptance TestGitFlowQueue.QueueAcceptance.test_saved_inspector_capture_preserves_live_branch_index_and_unrelated_work TestGitFlowQueue.QueueAcceptance.test_capture_exclusions_and_changed_bytes_stop_without_submission
